<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Open princess!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  /* Layout: one full-bleed black stage, the plant centred low, a small caption pinned top-left.
     Single dark look by choice: the piece is a lit object on black. */
  :root {
    --ink: #050509;          /* stage */
    --petal: #fdf8f7;        /* caption text */
    --pink: #ce3469;         /* accent, matches the petal throat */
    --dim: #8b8794;          /* secondary text */
    --display: "Arial", cursive, "Arial", cursive;
    --mono: "Arial", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ink); color: var(--petal); overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .cap { position: fixed; z-index: 2; pointer-events: none;
         top: calc(env(safe-area-inset-top, 0px) + 20px);
         left: max(16px, env(safe-area-inset-left, 0px)); }
  .cap h1 { margin: 0; font: italic 400 clamp(26px, 5vw, 40px)/1 var(--display); letter-spacing: .01em; }
  .cap p  { margin: 8px 0 0; font: 400 11px/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .hint { position: fixed; z-index: 2; left: 0; right: 0; text-align: center; pointer-events: none;
          bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
          font: 400 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .hint i { color: var(--pink); font-style: normal; }
</style>

<canvas id="c" aria-label="An oriental lily bouquet growing from drifting sparks into a full bloom"></canvas>
<div class="cap">
  <h1>Every flower blossoms with you in mind xx</h1>

 <p> </p>

  
</div>
<div class="hint"><i>●</i> Tap to replay</div>

<script>
(() => {
"use strict";
const DUR = 16;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.round(innerWidth * DPR); H = Math.round(innerHeight * DPR);
  cv.width = W; cv.height = H;
}
addEventListener("resize", resize); resize();

// ---------- math helpers  
const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const ease = x => sm(0, 1, x);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const lerpC = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const unit = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const rgb = c => `rgb(${clamp(c[0], 0, 255) | 0},${clamp(c[1], 0, 255) | 0},${clamp(c[2], 0, 255) | 0})`;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(7);
const gauss = () => Math.sqrt(-2 * Math.log(R() + 1e-9)) * Math.cos(6.2831853 * R());

// ---------- camera
function makeCam(theta) {
  const S = Math.min(W, H * 0.75);
  return { c: Math.cos(theta), s: Math.sin(theta), cp: Math.cos(0.16), sp: Math.sin(0.16),
           D: 2.55, zc: 0.66, f: S * 1.12, cx: W / 2, cy: H * 0.56 };
}
const camVec = (k, P) => { const xr = P[0] * k.c - P[1] * k.s, yr = P[0] * k.s + P[1] * k.c;
  return [xr, yr * k.cp - P[2] * k.sp, P[2] * k.cp + yr * k.sp]; };
const proj = (k, P) => { const v = camVec(k, P), d = v[1] + k.D;
  return [k.cx + k.f * v[0] / d, k.cy - k.f * (v[2] - k.zc) / d, d]; };
const LIGHT = unit([-0.45, -0.6, 0.65]);

// ---------- colours
const WHITE = [253, 248, 247], LPINK = [246, 196, 214], DPINK = [206, 52, 105], SPOT = [150, 28, 66];
const GREEN_D = [22, 84, 34], GREEN_L = [86, 168, 82], BLACKISH = [4, 5, 9];
function petalColor(u, v) {
  const p = sm(0.72, 0.08, u) * (1 - 0.45 * v * v);
  const stripe = Math.exp(-((v / 0.16) ** 2)) * sm(0.95, 0.15, u);
  let c = lerpC(WHITE, LPINK, clamp(p * 1.1, 0, 1));
  c = lerpC(c, DPINK, clamp(p ** 2.2 * 0.9 + stripe * 0.35 * p, 0, 1));
  return lerpC(c, [196, 220, 130], sm(0.14, 0, u) * 0.9);
}

// ---------- plant layout
const stemPt = t => [0.05 * Math.sin(2.6 * t) * t, 0.03 * Math.sin(5 * t), 1.02 * t];
const FLOWERS = [
  { fr: 0.80, B: [0.00, 0.00, 1.06], d: [0.32, 0.18, 0.93], size: 1.00, roll: 0.2 },
  { fr: 0.60, B: [-0.36, 0.06, 0.86], d: [-0.78, 0.12, 0.62], size: 0.93, roll: 1.1 },
  { fr: 0.45, B: [0.34, -0.10, 0.62], d: [0.78, -0.10, 0.62], size: 0.88, roll: 2.0 },
];
const BUDS = [
  { fr: 0.86, B: [0.03, 0.02, 1.16], d: [0.10, 0.05, 1.0], size: 1.0 },
  { fr: 0.72, B: [-0.12, -0.06, 1.02], d: [-0.45, -0.1, 0.9], size: 0.7 },
];
const LEAVES = Array.from({ length: 9 }, (_, i) => [0.08 + 0.54 * i / 8, i * 2.4 + 0.5]);
function frameAxes(d, roll) {
  d = unit(d);
  const a = Math.abs(d[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0];
  const e1 = unit(cross(d, a)), e2 = cross(d, e1);
  return [d, add(mul(e1, Math.cos(roll)), mul(e2, Math.sin(roll))),
             add(mul(e1, -Math.sin(roll)), mul(e2, Math.cos(roll)))];
}

// ---------- petal geometry
function petalPath(inner, o, size) {
  const N = 40, L = 0.31 * size;
  const th0 = lerp(0.10, 0.95 - 0.12 * inner, o), curl = lerp(0.12, 0.95, o) * (1 - 0.1 * inner);
  const Rr = [0], Zz = [0], Th = [];
  for (let i = 0; i <= N; i++) Th.push(th0 + curl * Math.pow(i / N, 1.4));
  for (let i = 1; i <= N; i++) {
    Rr.push(Rr[i - 1] + (Math.sin(Th[i]) + Math.sin(Th[i - 1])) / 2 / N * L);
    Zz.push(Zz[i - 1] + (Math.cos(Th[i]) + Math.cos(Th[i - 1])) / 2 / N * L);
  }
  return { N, Rr, Zz, Th };
}
function petalPoint(path, u, v, k, B, d, e1, e2, o, size) {
  const inner = k % 2, x = u * path.N, i = Math.min(path.N - 1, Math.floor(x)), f = x - i;
  const r = lerp(path.Rr[i], path.Rr[i + 1], f), z = lerp(path.Zz[i], path.Zz[i + 1], f), t = lerp(path.Th[i], path.Th[i + 1], f);
  const wid = (0.013 + 0.215 * Math.pow(u, 0.45) * Math.pow(1 - u, 0.72)) * size * (0.55 + 0.45 * o) * (inner ? 0.92 : 1);
  const y = v * wid;
  const off = 0.55 * v * v * wid * (0.4 + 0.6 * o) - 0.03 * Math.sin(Math.PI * u) * o * size;
  const phi = k * Math.PI / 3;
  const ep = add(mul(e1, Math.cos(phi)), mul(e2, Math.sin(phi)));
  const lat = add(mul(e1, -Math.sin(phi)), mul(e2, Math.cos(phi)));
  const nrm = add(mul(ep, -Math.cos(t)), mul(d, Math.sin(t)));
  return add(add(add(add(B, mul(ep, r)), mul(d, z)), mul(lat, y)), mul(nrm, off));
}
function leafPoint(u, v, base, az, size) {
  const L = 0.34 * size, wid = 0.065 * size * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.8)), 0.9);
  const out = [Math.cos(az), Math.sin(az), 0], lat = [-Math.sin(az), Math.cos(az), 0];
  const r = L * u, z = 0.30 * L * u - 0.55 * L * u * u;
  return add(add(add(base, mul(out, r)), [0, 0, z]), mul(lat, v * wid));
}

// ---------- frame (painter's algorithm)
class Frame {
  constructor(cam) { this.cam = cam; this.items = []; }
  quad(P, col, s, wire, nrm, bias = 0) {
    const pts = []; let dm = 0;
    for (const p of P) { const q = proj(this.cam, p); pts.push(q[0], q[1]); dm += q[2]; }
    dm /= P.length;
    let shade = 1;
    if (nrm) { const n = camVec(this.cam, nrm); shade = 0.80 + 0.32 * Math.abs(dot(n, LIGHT) / (Math.hypot(n[0], n[1], n[2]) + 1e-9)); }
    const k = shade * clamp(1.08 - 0.12 * (dm - this.cam.D), 0.8, 1.1);
    const fill = lerpC(BLACKISH, [col[0] * k, col[1] * k, col[2] * k], s);
    const edge = lerpC(wire, fill, s);
    this.items.push({ d: dm + bias, k: 0, pts, fill: rgb(fill), edge: rgb(edge), lw: lerp(0.8, 1.3, s) * DPR });
  }
  line(P, col, width, bias = 0) {
    const pts = []; let dm = 0;
    for (const p of P) { const q = proj(this.cam, p); pts.push(q[0], q[1]); dm += q[2]; }
    dm /= P.length;
    this.items.push({ d: dm + bias, k: 1, pts, col: rgb(col), w: Math.max(1, width * this.cam.f / dm) });
  }
  dot(p, rad, col, bias = 0, glow = false) {
    const q = proj(this.cam, p);
    this.items.push({ d: q[2] + bias, k: glow ? 3 : 2, x: q[0], y: q[1], r: Math.max(1, rad * this.cam.f / q[2]), col, c: rgb(col) });
  }
  flush() {
    this.items.sort((a, b) => b.d - a.d);
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    for (const it of this.items) {
      if (it.k === 0) {
        const p = it.pts; ctx.beginPath(); ctx.moveTo(p[0], p[1]);
        for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]);
        ctx.closePath(); ctx.fillStyle = it.fill; ctx.fill();
        ctx.strokeStyle = it.edge; ctx.lineWidth = it.lw; ctx.stroke();
      } else if (it.k === 1) {
        const p = it.pts; ctx.beginPath(); ctx.moveTo(p[0], p[1]);
        for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]);
        ctx.strokeStyle = it.col; ctx.lineWidth = it.w; ctx.stroke();
      } else {
        if (it.k === 3) {
          const [r, g, b] = it.col;
          ctx.fillStyle = `rgba(${r | 0},${g | 0},${b | 0},0.10)`; ctx.beginPath(); ctx.arc(it.x, it.y, it.r * 3.2, 0, 6.2832); ctx.fill();
          ctx.fillStyle = `rgba(${r | 0},${g | 0},${b | 0},0.22)`; ctx.beginPath(); ctx.arc(it.x, it.y, it.r * 2, 0, 6.2832); ctx.fill();
        }
        ctx.fillStyle = it.c; ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, 6.2832); ctx.fill();
      }
    }
  }
}

// ---------- fixed random data
const SPARK = Array.from({ length: 190 }, (_, i) => ({
  p0: [gauss() * 0.55, gauss() * 0.55, gauss() * 0.55 + 0.6],
  t: R(), ph: R() * 6.2832, sz: 0.004 + R() * 0.005, dust: i >= 130 }));
const SPOTS = Array.from({ length: 18 }, () => Array.from({ length: 26 }, () =>
  [0.10 + 0.55 * Math.pow(R(), 1.2), (R() * 2 - 1) * 0.72]));

// ---------- scene
function build(t) {
  const cam = makeCam(0.62 * Math.sin(0.52 * t + 0.4) + 0.05 * t);
  const fr = new Frame(cam);
  const gMain = ease((t - 2.2) / 4.2), sStem = sm(4.0, 7.0, t);
  const WIRE_G = [120, 255, 120];

  // stem
  if (gMain > 0.01) {
    const n = 48, ts = [], pts = [];
    for (let i = 0; i < n; i++) { const tt = gMain * i / (n - 1); ts.push(tt); pts.push(proj(cam, stemPt(tt))); }
    for (let a = 0; a < n - 1; a++) {
      const [x0, y0, d0] = pts[a], [x1, y1, d1] = pts[a + 1];
      const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) + 1e-9, nx = -dy / L, ny = dx / L;
      const w = 0.017 * (1 - 0.5 * ts[a]) * cam.f / ((d0 + d1) / 2);
      const col = lerpC(GREEN_D, GREEN_L, 0.35 + 0.2 * Math.sin(a));
      const fill = lerpC(BLACKISH, col, sStem), edge = lerpC(WIRE_G, fill, sStem);
      fr.items.push({ d: (d0 + d1) / 2, k: 0, fill: rgb(fill), edge: rgb(edge), lw: DPR,
        pts: [x0 + nx * w, y0 + ny * w, x1 + nx * w, y1 + ny * w, x1 - nx * w, y1 - ny * w, x0 - nx * w, y0 - ny * w] });
    }
  }
  // leaves
  for (const [f, az] of LEAVES) {
    const grow = clamp((gMain - f) / 0.22, 0, 1); if (grow <= 0) continue;
    const size = (0.55 + 0.7 * (1 - f)) * ease(grow), base = stemPt(f);
    const G = [];
    for (let i = 0; i <= 8; i++) { G.push([]); for (let j = 0; j <= 4; j++) G[i].push(leafPoint(i / 8, j / 2 - 1, base, az, size)); }
    for (let i = 0; i < 8; i++) for (let j = 0; j < 4; j++) {
      const q = [G[i][j], G[i + 1][j], G[i + 1][j + 1], G[i][j + 1]];
      const nrm = cross(sub(q[1], q[0]), sub(q[3], q[0]));
      const mid = Math.abs((j / 2 - 1 + (j + 1) / 2 - 1) / 2);
      fr.quad(q, lerpC(GREEN_L, GREEN_D, clamp(mid * 0.9 + i / 14, 0, 1)), sStem, [110, 240, 120], nrm);
    }
  }
  // branches + flowers
  FLOWERS.forEach((F, fi) => {
    const tb = 4.2 + 0.7 * fi, gb = ease((t - tb) / 1.6); if (gb <= 0) return;
    const S0 = stemPt(F.fr), B = F.B, mid = add(mul(add(S0, B), 0.5), [0, 0, -0.05]);
    const bez = []; for (let i = 0; i < 14; i++) { const tt = gb * i / 13;
      bez.push(add(add(mul(S0, (1 - tt) ** 2), mul(mid, 2 * (1 - tt) * tt)), mul(B, tt * tt))); }
    fr.line(bez, lerpC(WIRE_G, [48, 125, 52], sStem), 0.026);
    if (gb < 1) return;
    let o = ease((t - (tb + 1.6)) / 3.2); o *= 1 + 0.025 * Math.sin(1.3 * t + fi);
    const s = sm(0.30, 0.85, ease((t - (tb + 2.6)) / 3.2));
    const [d, e1, e2] = frameAxes(F.d, F.roll), size = F.size;
    for (let k = 0; k < 6; k++) {
      const path = petalPath(k % 2, o, size), G = [];
      for (let i = 0; i <= 8; i++) { G.push([]); for (let j = 0; j <= 6; j++) G[i].push(petalPoint(path, i / 8, j / 3 - 1, k, B, d, e1, e2, o, size)); }
      for (let i = 0; i < 8; i++) for (let j = 0; j < 6; j++) {
        const q = [G[i][j], G[i + 1][j], G[i + 1][j + 1], G[i][j + 1]];
        const nrm = cross(sub(q[1], q[0]), sub(q[3], q[0]));
        const uc = (i + 0.5) / 8, vc = (j + 0.5) / 3 - 1;
        fr.quad(q, petalColor(uc, vc), s, lerpC([255, 120, 170], [255, 190, 215], uc), nrm);
      }
      if (s > 0.55) for (const [u_, v_] of SPOTS[fi * 6 + k])
        fr.dot(petalPoint(path, u_, v_, k, B, d, e1, e2, o, size), 0.0042 * size,
               lerpC(petalColor(u_, v_), SPOT, 0.85 * sm(0.55, 0.9, s)), -0.012);
    }
    for (let k = 0; k < 6; k++) {
      const phi = k * Math.PI / 3 + 0.3, ep = add(mul(e1, Math.cos(phi)), mul(e2, Math.sin(phi)));
      const reach = (0.05 + 0.12 * o) * size, P = [];
      for (let i = 0; i < 8; i++) { const tt = i / 7;
        P.push(add(add(B, mul(d, 0.01 + (0.08 + 0.05 * o) * tt * size)), mul(ep, reach * Math.pow(tt, 1.6)))); }
      fr.line(P, lerpC([255, 140, 190], [232, 236, 200], s), 0.0045, -0.03);
      const tan = unit(sub(P[7], P[5]));
      fr.line([sub(P[7], mul(tan, 0.022 * size)), add(P[7], mul(tan, 0.012 * size))], lerpC([255, 170, 130], [158, 66, 28], s), 0.011, -0.04);
    }
    const PP = []; for (let i = 0; i < 8; i++) { const tt = i / 7;
      PP.push(add(add(B, mul(d, 0.01 + 0.17 * tt * size)), mul(e1, 0.03 * tt * tt * size))); }
    fr.line(PP, lerpC([255, 140, 190], [214, 232, 170], s), 0.0055, -0.03);
    fr.dot(PP[7], 0.010 * size, lerpC([255, 140, 190], [196, 232, 140], s), -0.05);
  });
  // buds
  BUDS.forEach((Bd, bi) => {
    const tb = 4.8 + 0.5 * bi, gb = ease((t - tb) / 1.6); if (gb <= 0) return;
    const S0 = stemPt(Bd.fr), B = Bd.B, pts = [];
    for (let i = 0; i < 8; i++) { const tt = gb * i / 7; pts.push(add(mul(S0, 1 - tt), mul(B, tt))); }
    fr.line(pts, lerpC(WIRE_G, [48, 125, 52], sStem), 0.02);
    if (gb < 1) return;
    const grow = ease((t - (tb + 1.6)) / 3.0), s = sm(0.3, 0.85, ease((t - (tb + 2.5)) / 3.0));
    const [d, e1, e2] = frameAxes(Bd.d, 0), sz = Bd.size * (0.4 + 0.6 * grow);
    const pt = (u, a) => { const r = 0.05 * sz * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.75)), 0.9) * (1 + 0.25 * Math.cos(3 * a));
      return add(add(B, mul(d, 0.17 * sz * u)), add(mul(e1, r * Math.cos(a)), mul(e2, r * Math.sin(a)))); };
    for (let i = 0; i < 6; i++) for (let j = 0; j < 8; j++) {
      const u0 = i / 6, u1 = (i + 1) / 6, a0 = j / 8 * 6.2832, a1 = (j + 1) / 8 * 6.2832;
      const q = [pt(u0, a0), pt(u1, a0), pt(u1, a1), pt(u0, a1)];
      let col = lerpC([96, 168, 80], [246, 196, 170], sm(0.25, 0.95, (u0 + u1) / 2));
      if (j % 4 === 0) col = lerpC(col, [120, 190, 90], 0.5);
      fr.quad(q, col, s, [255, 150, 190], cross(sub(q[1], q[0]), sub(q[3], q[0])));
    }
  });
  // sparkles
  for (const sp of SPARK) {
    const ph = sp.ph; let p, vis;
    if (sp.dust) {
      p = add(mul(sp.p0, 0.8), [0.05 * Math.sin(0.7 * t + ph), 0.05 * Math.cos(0.5 * t + ph), 0.05 * Math.sin(0.4 * t + 2 * ph) + 0.1 * Math.sin(0.2 * t)]);
      vis = sm(0, 1.2, t) * (0.35 + 0.65 * sm(6, 9, t));
    } else {
      const tgt = add(stemPt(sp.t * Math.max(gMain, 0.05)), [0.02 * Math.sin(2 * t + ph), 0.02 * Math.cos(2 * t + ph), 0]);
      const att = ease((t - 0.8 - 1.2 * sp.t) / 2.5), fall = 1 - sm(3.5, 6.5 + sp.t, t);
      const start = add(sp.p0, [0.06 * Math.sin(t + ph), 0.06 * Math.cos(0.8 * t + ph), 0.06 * Math.sin(0.6 * t)]);
      p = add(mul(start, 1 - att), mul(tgt, att));
      vis = sm(0, 1, t) * (0.25 + 0.75 * fall);
    }
    const tw = 0.55 + 0.45 * Math.sin(5 * t + ph * 3), a = vis * tw;
    if (a < 0.3) continue;
    const base = (sp.t < 0.5 || sp.dust) ? [255, 250, 200] : [190, 255, 180];
    fr.dot(p, sp.sz, mul(base, a), -0.2, true);
  }
  return fr;
}

function draw(t) {
  ctx.fillStyle = "#050509"; ctx.fillRect(0, 0, W, H);
  build(t).flush();
  const fade = sm(DUR - 1.2, DUR - 0.05, t);
  if (fade > 0) { ctx.fillStyle = `rgba(5,5,9,${fade})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- run
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
let t0 = performance.now();
addEventListener("pointerdown", () => { t0 = performance.now(); if (still) draw(12.5); });
function loop(now) { draw(((now - t0) / 1000) % DUR); requestAnimationFrame(loop); }
if (still) { draw(12.5); addEventListener("resize", () => draw(12.5)); }
else requestAnimationFrame(loop);
window.__draw = draw;   // lets a screenshot jump to a time
})();
</script>
